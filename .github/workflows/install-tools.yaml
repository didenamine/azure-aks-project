name: Install tools

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: "Select our Terraform workspace to use"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
      rg_name:
        description: "Put the name of the resource group to use"
        required: true
        default: "student35-rg-dev"
        type: string
      cluster_name:
        description: "Put the name of the AKS cluster to use"
        required: true
        default: "student35-aks-dev"
        type: string

permissions:
  id-token: write
  contents: read
jobs:
  install-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
      # The tools use their own state file, separate from the infrastructure state
      - name: Init
        working-directory: ./aks-tools
        run:  terraform init -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RG }}" -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER }}" -backend-config="key=aks-tools-${{ secrets.TF_BACKEND_KEY }}"
      - name: Terraform workspace select
        working-directory: ./aks-tools
        run: terraform workspace select ${{ github.event.inputs.workspace }} || terraform workspace new ${{ github.event.inputs.workspace }}
      - name: Terraform Plan
        working-directory: ./aks-tools
        run: terraform plan -var="rg_name=${{ github.event.inputs.rg_name }}" -var="cluster_name=${{ github.event.inputs.cluster_name }}"
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Terraform Apply
        working-directory: ./aks-tools
        run: terraform apply -var="rg_name=${{ github.event.inputs.rg_name }}" -var="cluster_name=${{ github.event.inputs.cluster_name }}" -auto-approve
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

name: Unlock Terraform state

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: "Select our Terraform workspace to use"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
      state:
        description: "Which state to unlock"
        required: true
        default: "infra"
        type: choice
        options:
          - infra
          - aks-tools
      lock_id:
        description: "Lock ID shown in the 'Error acquiring the state lock' message"
        required: true
        type: string

permissions:
  id-token: write
  contents: read
jobs:
  terraform-unlock:
    runs-on: ubuntu-latest
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      WORKDIR: ${{ inputs.state == 'infra' && './' || './aks-tools' }}
      STATE_KEY: ${{ inputs.state == 'infra' && secrets.TF_BACKEND_KEY || secrets.TF_TOOLS_BACKEND_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
      - name: Init
        working-directory: ${{ env.WORKDIR }}
        run: terraform init -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RG }}" -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER }}" -backend-config="key=${{ env.STATE_KEY }}"
      - name: Terraform workspace select
        working-directory: ${{ env.WORKDIR }}
        run: terraform workspace select ${{ inputs.workspace }}
      - name: Terraform force-unlock
        working-directory: ${{ env.WORKDIR }}
        run: terraform force-unlock -force ${{ inputs.lock_id }}
